{% extends 'base.html' %}

{% block title %}Order Confirmed - E-Store{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="card border-success">
        <div class="card-body">
            <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
            <h2>Order Confirmed!</h2>
            <p class="lead">Thank you for your order. Your order number is <strong>#{{ order.id }}</strong>.</p>
            <p>We have sent a confirmation email to your email address.</p>
            <div class="mt-4">
                <a href="{% url 'products:product_list' %}" class="btn btn-outline-primary me-2">
                    Continue Shopping
                </a>
                <a href="{% url 'orders:order_detail' order.id %}" class="btn btn-primary">
                    View Order Details
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
